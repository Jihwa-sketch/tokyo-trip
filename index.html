<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🗼 도쿄 여행 · 5/28–31</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--white:#fff;--border:#e2e0da;--border-light:#eeece8;
  --accent:#d94f2b;--text:#1c1b18;--mid:#6b6861;--dim:#a09d97;
  --sh:0 2px 12px rgba(0,0,0,.09);--sh-lg:0 8px 32px rgba(0,0,0,.15);
  --d28:#ff7c00;--d29:#2e9e6b;--d30:#0088ff;--d31:#e91e8c;
}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--white);border-bottom:1px solid var(--border);padding:12px 16px 10px}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px}
.logo span{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);margin-left:8px;letter-spacing:.5px;font-weight:400}
.members{display:flex;gap:5px}
.mtag{font-size:10px;padding:3px 9px;border-radius:14px;border:1px solid;font-weight:600}
.mtag-j{color:#c0421f;border-color:#f2c4b8;background:#fdf2ef}
.mtag-y{color:#6b3fa0;border-color:#d8c7f0;background:#f5f0fd}
.mtag-o{color:#a07a10;border-color:#f0dfa0;background:#fdf8e8}

/* DAY TABS */
.day-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.day-tabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;background:var(--bg);color:var(--dim);border:1px solid var(--border);cursor:pointer;transition:all .15s;font-family:'DM Mono',monospace}
.dtab.active-map{background:#1c1b18;color:white;border-color:#1c1b18}
.dtab.active-28{background:var(--d28);color:white;border-color:var(--d28)}
.dtab.active-29{background:var(--d29);color:white;border-color:var(--d29)}
.dtab.active-30{background:var(--d30);color:white;border-color:var(--d30)}
.dtab.active-31{background:var(--d31);color:white;border-color:var(--d31)}

/* MAIN */
.main{position:fixed;top:0;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 40px}
.main::-webkit-scrollbar{display:none}

/* DAY STICKY HEADER */
.day-sticky{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 16px 6px;display:flex;align-items:center;gap:10px}
.day-big{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1}
.day-date-str{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.5px}
.day-theme-str{display:none}

.day-sticky.d28 .day-big{color:var(--d28)}
.day-sticky.d28 .day-date-str{color:var(--d28)}
.day-sticky.d29 .day-big{color:var(--d29)}
.day-sticky.d29 .day-date-str{color:var(--d29)}
.day-sticky.d30 .day-big{color:var(--d30)}
.day-sticky.d30 .day-date-str{color:var(--d30)}
.day-sticky.d31 .day-big{color:var(--d31)}
.day-sticky.d31 .day-date-str{color:var(--d31)}

/* PLACE ITEMS */
.place-item{margin:0 12px 5px;background:var(--white);border-radius:12px;border:1px solid var(--border-light);display:flex;align-items:stretch;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;position:relative}
.place-item:active{transform:scale(.98);opacity:.88}
.place-item.d28{border-left:3.5px solid var(--d28)}
.place-item.d29{border-left:3.5px solid var(--d29)}
.place-item.d30{border-left:3.5px solid var(--d30)}
.place-item.d31{border-left:3.5px solid var(--d31)}

.pi-time{width:46px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;background:var(--bg);border-right:1px solid var(--border-light)}
.pi-time-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--mid);line-height:1.2;text-align:center}

.pi-body{flex:1;padding:11px 12px;min-width:0}
.pi-name{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:2px}
.pi-sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pi-right{display:flex;align-items:center;padding:0 10px;gap:8px}
.pi-edit{background:none;border:none;cursor:pointer;font-size:16px;color:var(--dim);padding:4px;border-radius:6px;transition:all .15s;-webkit-tap-highlight-color:transparent}
.pi-edit:active{background:var(--bg);color:var(--text)}
.pi-arrow{color:var(--dim);font-size:18px;font-weight:300}

/* SHEET */
.map-sheet{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--white);border-radius:20px 20px 0 0;box-shadow:0 -4px 32px rgba(0,0,0,.18);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;max-height:88vh}
.map-sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:10px auto 0;flex-shrink:0}
.sheet-head{padding:12px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.sheet-info{flex:1;min-width:0;margin-right:10px}
.sheet-name{font-size:17px;font-weight:700;line-height:1.3;margin-bottom:5px}
.sheet-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);margin-bottom:6px}
.sheet-desc{font-size:12px;color:var(--mid);line-height:1.5;padding:8px 10px;background:var(--bg);border-radius:8px}
.sheet-close{background:none;border:none;cursor:pointer;font-size:22px;color:var(--dim);padding:0;flex-shrink:0;margin-top:-2px}
.sheet-map{flex:1;min-height:220px;position:relative}
#mobileMap{width:100%;height:100%;border:none;display:block}
.sheet-actions{padding:12px 16px 20px;display:flex;gap:8px;flex-shrink:0;border-top:1px solid var(--border-light)}
.sab{flex:1;padding:12px;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .12s}
.sab-dark{background:#1c1b18;color:white}
.sab-ghost{background:none;border:1.5px solid var(--border);color:var(--mid)}

/* DIM */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:190;display:none;backdrop-filter:blur(2px)}
.dim.on{display:block}

/* EDIT SHEET */
.edit-sheet{position:fixed;bottom:0;left:0;right:0;z-index:300;background:var(--white);border-radius:20px 20px 0 0;box-shadow:0 -4px 32px rgba(0,0,0,.2);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding:0 0 30px}
/* 날짜 헤더 + 버튼 */
.day-sticky{justify-content:space-between}
.day-sticky-left{display:flex;align-items:center;gap:10px}
.day-add-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--accent);color:white;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(217,79,43,.35);transition:all .15s;-webkit-tap-highlight-color:transparent}
.day-add-btn:active{transform:scale(.9)}
/* 추가 시트 — 수정 시트와 동일 스타일 공유 */
.add-sheet{position:fixed;bottom:0;left:0;right:0;z-index:300;background:var(--white);border-radius:20px 20px 0 0;box-shadow:0 -4px 32px rgba(0,0,0,.2);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding:0 0 30px}
.add-sheet.open{transform:translateY(0)}
.edit-sheet.open{transform:translateY(0)}
.edit-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:10px auto 14px}
.edit-title{font-size:15px;font-weight:700;padding:0 16px 14px;border-bottom:1px solid var(--border-light)}
.edit-body{padding:16px}
.ef{margin-bottom:14px}
.ef label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:5px}
.ef input,.ef textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);background:var(--bg);outline:none}
.ef input:focus,.ef textarea:focus{border-color:var(--accent);background:#fff}
.ef textarea{resize:none;height:56px}
.edit-actions{padding:0 16px;display:flex;gap:8px}
.edit-actions .sab{padding:12px}
.sab-red{background:var(--accent);color:white}
.sab-danger{background:none;border:1.5px solid #f2c4b8;color:#c0421f}

/* FULL MAP */
.full-map-view{position:fixed;top:0;bottom:0;left:0;right:0;z-index:50;display:none}
.full-map-view.show{display:block}
#fullMap{width:100%;height:100%;border:none}

/* PIN LEGEND */
.map-legend{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:16px;padding:6px 14px;display:flex;gap:12px;font-size:11px;white-space:nowrap;box-shadow:var(--sh)}
.leg-item{display:flex;align-items:center;gap:5px;font-weight:600}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
</style>
<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">TOKYO 🗼<span>MAY 28–31</span></div>
    <div class="members">
      <span class="mtag mtag-j">져니</span>
      <span class="mtag mtag-y">예예</span>
      <span class="mtag mtag-o">오브</span>
    </div>
  </div>
  <div class="day-tabs">
    <div class="dtab" id="tab-map" onclick="showFullMap(this)">🗺️ 전체</div>

    <div class="dtab" id="tab-30" onclick="switchDay(30,this)">5/30 토</div>

</div>

<!-- 전체 지도 뷰 -->
<div class="full-map-view" id="fullMapView">
  <div id="fullMap"></div>

</div>

<!-- 메인 스크롤 -->
<div class="main" id="mainScroll">

  <!-- 28일 -->
  <div class="day-sticky d28" id="anchor-28">

    </div>
    <button class="day-add-btn" onclick="openAdd(29)" title="일정 추가">＋</button>

  <!-- 30일 -->
  <div class="day-sticky d30" id="anchor-30">

</div>

<!-- 딤 -->
<div class="dim" id="dim" onclick="closeDim()"></div>

<!-- 지도 바텀시트 -->

</div>

<!-- 수정 시트 -->
<div class="edit-sheet" id="editSheet">
  <div class="edit-handle"></div>
  <div class="edit-title" id="editTitle">일정 수정</div>
  <div class="edit-body">

    <button class="sab sab-ghost" onclick="closeEdit()">취소</button>
  </div>
</div>

<!-- 추가 시트 -->
<div class="add-sheet" id="addSheet">

  <div class="edit-title" id="addTitle">일정 추가</div>

    <div class="ef"><label>시간</label><input id="aTime" type="time" value="12:00"></div>

    <div class="ef"><label>구글맵 링크 (선택)</label><input id="aGmap" type="url" placeholder="https://maps.app.goo.gl/..."></div>
  </div>
  <div class="edit-actions">
    <button class="sab sab-red" onclick="confirmAdd()">추가</button>
    <button class="sab sab-ghost" onclick="closeAdd()">취소</button>
  </div>
</div>

<script>
// ── 데이터 ──
const defaultSchedule = {
  28: [
    {id:'d28-1', time:'08:50', name:'✈️ 인천 출발',          desc:'에어프레미아 · ICN→NRT', q:'인천국제공항', gmap:'https://maps.app.goo.gl/UuaVkqeCq6h2QviNA'},

// 로딩 상태 표시
let schedule = {};

function showLoading(show) {
  let el = document.getElementById('loadingBar');
  if (!el) {
    el = document.createElement('div');
    el.id = 'loadingBar';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);z-index:999;transition:opacity .4s';
    document.body.appendChild(el);
  }
  el.style.opacity = show ? '1' : '0';
}

// Firebase 실시간 리스너 — 다른 사람이 수정하면 자동 반영
scheduleRef.on('value', snapshot => {
  const data = snapshot.val();
  if (data) {
    // Firebase 데이터 파싱 (object → array 변환)
    schedule = {};
    [28,29,30,31].forEach(d => {
      if (data[d]) {
        // Firebase는 배열을 object로 저장하므로 values로 변환
        schedule[d] = Object.values(data[d]).sort((a,b) => a.time.localeCompare(b.time));
      } else {
        schedule[d] = [];
      }
    });
  } else {
    // 첫 실행: 기본 데이터를 Firebase에 업로드
    schedule = JSON.parse(JSON.stringify(defaultSchedule));
    saveAllToFirebase();
  }
  if (!isLoaded) {
    isLoaded = true;
    adjustLayout();
    renderAll();
  } else {
    renderAll();
  }
  showLoading(false);
});
showLoading(true);

// 전체 schedule을 Firebase에 저장
function saveAllToFirebase() {
  const data = {};
  [28,29,30,31].forEach(d => {
    data[d] = {};
    (schedule[d] || []).forEach(p => { data[d][p.id] = p; });
  });
  scheduleRef.set(data);
}

// 특정 날짜 하루만 Firebase에 저장
function saveDayToFirebase(day) {
  const data = {};
  (schedule[day] || []).forEach(p => { data[p.id] = p; });
  scheduleRef.child(String(day)).set(data);
}

// ── 렌더링 ──
function renderAll() {
  [28,29,30,31].forEach(d => renderDay(d));
}

function renderDay(d) {
  const sec = document.getElementById('section-' + d);
  if (!sec) return;
  sec.innerHTML = '';
  (schedule[d] || []).forEach(p => {
    const div = document.createElement('div');
    div.className = `place-item d${d}`;
    div.id = 'item-' + p.id;
    div.innerHTML = `
      <div class="pi-time"><div class="pi-time-val">${p.time}</div></div>
      <div class="pi-body" onclick="openSheet('${p.id}',${d})">
        <div class="pi-name">${p.name}</div>
        <div class="pi-sub">${p.desc}</div>
      </div>
      <div class="pi-right">
        <button class="pi-edit" onclick="event.stopPropagation();openEdit('${p.id}',${d})" title="수정">✏️</button>
        <span class="pi-arrow" onclick="openSheet('${p.id}',${d})">›</span>
      </div>`;
    sec.appendChild(div);
  });
}

// ── 지도 시트 ──
function openSheet(id, day) {
  const items = schedule[day] || [];
  const p = items.find(x => x.id === id);
  if (!p) return;
  currentId = id;

  document.getElementById('sheetName').textContent = p.name;
  document.getElementById('sheetTime').textContent = `${['','5/28 목','5/29 금','5/30 토','5/31 일'][day-27]} · ${p.time}`;
  document.getElementById('sheetDesc').textContent = p.desc;

  const q = encodeURIComponent(p.q || p.name + ' Tokyo');
  document.getElementById('mobileMap').src = `https://maps.google.com/maps?q=${q}&output=embed&hl=ko&z=16`;

  document.getElementById('mapSheet').classList.add('open');
  document.getElementById('dim').classList.add('on');
  // gmap 저장
  document.getElementById('mapSheet').dataset.gmap = p.gmap || '';
  document.getElementById('mapSheet').dataset.q = p.q || p.name;
}

function closeSheet() {
  document.getElementById('mapSheet').classList.remove('open');
  if (!document.getElementById('editSheet').classList.contains('open'))
    document.getElementById('dim').classList.remove('on');
  setTimeout(() => document.getElementById('mobileMap').src = '', 350);
  currentId = null;
}

function openGoogleMaps() {
  const gmap = document.getElementById('mapSheet').dataset.gmap;
  const q = document.getElementById('mapSheet').dataset.q;
  if (gmap) window.open(gmap, '_blank');
  else window.open(`https://www.google.com/maps/search/${encodeURIComponent(q)}`, '_blank');
}

function closeDim() {
  closeSheet();
  closeEdit();
  closeAdd();
}

// ── 수정 시트 ──
function openEdit(id, day) {
  const items = schedule[day] || [];
  const p = items.find(x => x.id === id);
  if (!p) return;
  currentEditId = id;
  currentEditDay = day;

  document.getElementById('editTitle').textContent = p.name;
  document.getElementById('eName').value = p.name;
  document.getElementById('eTime').value = p.time;
  document.getElementById('eDesc').value = p.desc;

  document.getElementById('editSheet').classList.add('open');
  document.getElementById('dim').classList.add('on');
}

function closeEdit() {
  document.getElementById('editSheet').classList.remove('open');
  document.getElementById('dim').classList.remove('on');
  currentEditId = null; currentEditDay = null;
}

function saveEdit() {
  if (!currentEditId || !currentEditDay) return;
  const items = schedule[currentEditDay];
  const p = items.find(x => x.id === currentEditId);
  if (!p) return;
  p.name = document.getElementById('eName').value.trim() || p.name;
  p.time = document.getElementById('eTime').value || p.time;
  p.desc = document.getElementById('eDesc').value.trim();
  schedule[currentEditDay].sort((a,b) => a.time.localeCompare(b.time));
  saveDayToFirebase(currentEditDay); // Firebase 저장
  renderDay(currentEditDay);
  closeEdit();
  showToast('저장됐어요 ✓');
}

function deleteItem() {
  if (!currentEditId || !currentEditDay) return;
  const p = schedule[currentEditDay].find(x => x.id === currentEditId);
  if (!confirm(`"${p?.name}" 을 삭제할까요?`)) return;
  schedule[currentEditDay] = schedule[currentEditDay].filter(x => x.id !== currentEditId);
  scheduleRef.child(String(currentEditDay)).child(currentEditId).remove(); // Firebase 삭제
  renderDay(currentEditDay);
  closeEdit();
  showToast('삭제됐어요');
}

// ── 장소 추가 ──
let addTargetDay = null;

function openAdd(day) {
  addTargetDay = day;
  const dayNames = {28:'5/28 목요일', 29:'5/29 금요일', 30:'5/30 토요일', 31:'5/31 일요일'};
  document.getElementById('addTitle').textContent = `+ ${dayNames[day]} 일정 추가`;
  document.getElementById('aName').value = '';
  document.getElementById('aTime').value = '12:00';
  document.getElementById('aDesc').value = '';
  document.getElementById('aGmap').value = '';
  document.getElementById('addSheet').classList.add('open');
  document.getElementById('dim').classList.add('on');
  setTimeout(() => document.getElementById('aName').focus(), 350);
}

function closeAdd() {
  document.getElementById('addSheet').classList.remove('open');
  document.getElementById('dim').classList.remove('on');
  addTargetDay = null;
}

function confirmAdd() {
  const name = document.getElementById('aName').value.trim();
  if (!name) { showToast('장소명을 입력해주세요'); return; }
  const time = document.getElementById('aTime').value || '00:00';
  const desc = document.getElementById('aDesc').value.trim();
  const gmap = document.getElementById('aGmap').value.trim();
  const id = 'd' + addTargetDay + '-' + Date.now();
  const newItem = { id, time, name, desc, q: name + ' Tokyo', gmap };
  if (!schedule[addTargetDay]) schedule[addTargetDay] = [];
  schedule[addTargetDay].push(newItem);
  schedule[addTargetDay].sort((a,b) => a.time.localeCompare(b.time));
  saveDayToFirebase(addTargetDay);
  renderDay(addTargetDay);
  closeAdd();
  showToast(`"${name}" 추가됐어요 📍`);
}

const mainEl = document.getElementById('mainScroll');
mainEl.addEventListener('scroll', () => {
  if (isFullMap) return;
  const sy = mainEl.scrollTop;
  [28,29,30,31].forEach(d => {
    const el = document.getElementById('anchor-'+d);
    if (el && el.offsetTop <= sy + 60) {
      document.querySelectorAll('.dtab').forEach(t => t.className='dtab');
      document.getElementById('tab-'+d).className = `dtab active-${d}`;
    }
  });
}, {passive:true});

// 헤더 높이에 맞게 top 동적 조정
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#1c1b18;color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:500;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(60px)';
  }, 2000);
}

function adjustLayout() {
  const h = document.querySelector('.header').offsetHeight;
  document.getElementById('mainScroll').style.top = h + 'px';
  document.getElementById('fullMapView').style.top = h + 'px';
}
window.addEventListener('resize', adjustLayout);
adjustLayout();
